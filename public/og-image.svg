<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradient for dynamic background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFAFA"/>
      <stop offset="50%" style="stop-color:#F5F5F5"/>
      <stop offset="100%" style="stop-color:#EBEBEB"/>
    </linearGradient>

    <!-- Orange accent gradient -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C36312"/>
      <stop offset="100%" style="stop-color:#DD904F"/>
    </linearGradient>

    <!-- Teal accent gradient -->
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#02807D"/>
      <stop offset="100%" style="stop-color:#0E7F6C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Dynamic abstract shapes - geometric pattern -->
  <!-- Large prism shape top right -->
  <polygon points="1100,0 1200,0 1200,150 1050,100" fill="#C36312" opacity="0.15"/>
  <polygon points="950,0 1100,0 1050,100 900,60" fill="#02807D" opacity="0.12"/>

  <!-- Floating geometric elements -->
  <polygon points="100,500 150,450 200,500 150,550" fill="#C36312" opacity="0.1"/>
  <polygon points="1000,400 1060,360 1120,400 1060,440" fill="#02807D" opacity="0.1"/>
  <polygon points="180,100 220,60 260,100 220,140" fill="#0E7F6C" opacity="0.08"/>

  <!-- Grid lines for tech aesthetic -->
  <line x1="0" y1="200" x2="300" y2="200" stroke="#C36312" stroke-width="1" opacity="0.1"/>
  <line x1="900" y1="430" x2="1200" y2="430" stroke="#02807D" stroke-width="1" opacity="0.1"/>
  <line x1="50" y1="0" x2="50" y2="150" stroke="#0E7F6C" stroke-width="1" opacity="0.08"/>
  <line x1="1150" y1="480" x2="1150" y2="630" stroke="#C36312" stroke-width="1" opacity="0.08"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="550" r="4" fill="#C36312" opacity="0.2"/>
  <circle cx="100" cy="570" r="3" fill="#02807D" opacity="0.15"/>
  <circle cx="1120" cy="80" r="5" fill="#0E7F6C" opacity="0.2"/>
  <circle cx="1080" cy="100" r="3" fill="#C36312" opacity="0.15"/>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#C36312" stroke-width="4"/>

  <!-- Corner accents -->
  <rect x="40" y="40" width="60" height="4" fill="#02807D"/>
  <rect x="40" y="40" width="4" height="60" fill="#02807D"/>
  <rect x="1100" y="40" width="60" height="4" fill="#0E7F6C"/>
  <rect x="1156" y="40" width="4" height="60" fill="#0E7F6C"/>
  <rect x="40" y="586" width="60" height="4" fill="#0E7F6C"/>
  <rect x="40" y="530" width="4" height="60" fill="#0E7F6C"/>
  <rect x="1100" y="586" width="60" height="4" fill="#02807D"/>
  <rect x="1156" y="530" width="4" height="60" fill="#02807D"/>

  <!-- Book element - left side -->
  <g transform="translate(100, 140)">
    <!-- Book spine -->
    <rect x="0" y="0" width="35" height="320" fill="#C36312"/>
    <rect x="5" y="10" width="3" height="300" fill="#060606" opacity="0.2"/>

    <!-- Book cover -->
    <rect x="35" y="0" width="220" height="320" fill="#060606" stroke="#C36312" stroke-width="4"/>

    <!-- Cover design elements -->
    <rect x="55" y="30" width="180" height="3" fill="#C36312"/>

    <!-- Mini prism logo on book -->
    <g transform="translate(145, 100)">
      <polygon points="0,-35 30,-17 30,17 0,35 -30,17 -30,-17" fill="none" stroke="#C36312" stroke-width="2"/>
      <line x1="0" y1="-35" x2="0" y2="0" stroke="#C36312" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="-30" y2="-17" stroke="#C36312" stroke-width="1.5"/>
      <line x1="0" y1="0" x2="30" y2="-17" stroke="#C36312" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#C36312"/>
    </g>

    <text x="145" y="180" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FAFAFA" text-anchor="middle">MASTERING</text>
    <text x="145" y="210" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#C36312" text-anchor="middle">EVM</text>

    <rect x="55" y="230" width="180" height="3" fill="#02807D"/>

    <text x="145" y="280" font-family="system-ui, sans-serif" font-size="12" fill="#737373" text-anchor="middle" letter-spacing="2">FREE ONLINE BOOK</text>
  </g>

  <!-- Main title - right side -->
  <text x="720" y="200" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#060606" text-anchor="middle">MASTERING THE</text>
  <text x="720" y="290" font-family="system-ui, sans-serif" font-size="72" font-weight="900" fill="#C36312" text-anchor="middle">ETHEREUM</text>
  <text x="720" y="375" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#060606" text-anchor="middle">VIRTUAL MACHINE</text>

  <!-- CTA Button -->
  <g transform="translate(720, 430)">
    <rect x="-100" y="0" width="200" height="56" fill="#C36312" rx="0"/>
    <rect x="-100" y="0" width="200" height="56" fill="none" stroke="#060606" stroke-width="3"/>
    <!-- Shadow effect -->
    <rect x="-96" y="4" width="200" height="56" fill="#060606" opacity="0.2" rx="0"/>
    <text x="0" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#FAFAFA" text-anchor="middle" letter-spacing="2">READ NOW</text>
  </g>

  <!-- URL -->
  <text x="720" y="550" font-family="system-ui, sans-serif" font-size="26" fill="#02807D" text-anchor="middle" font-weight="600">masteringevm.com</text>
</svg>
