<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient matching book cover -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="50%" style="stop-color:#1a1a3a"/>
      <stop offset="100%" style="stop-color:#0f0f2f"/>
    </linearGradient>

    <!-- Accent gradient matching book cover -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#627EEA"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#3AB83A"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Hexagon pattern -->
    <pattern id="hexPattern" width="80" height="69" patternUnits="userSpaceOnUse">
      <polygon points="40,0 80,20 80,49 40,69 0,49 0,20"
               fill="none" stroke="#627EEA" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Hexagon pattern overlay -->
  <rect width="1200" height="630" fill="url(#hexPattern)"/>

  <!-- Decorative circuit lines -->
  <g stroke="#627EEA" stroke-width="1" opacity="0.25" fill="none">
    <path d="M0,150 L150,150 L180,180 L300,180"/>
    <path d="M1200,200 L1050,200 L1020,230 L900,230"/>
    <path d="M0,480 L120,480 L150,450 L280,450"/>
    <path d="M1200,400 L1080,400 L1050,430 L920,430"/>
  </g>

  <!-- Floating nodes -->
  <g fill="#627EEA" opacity="0.35">
    <circle cx="120" cy="120" r="5"/>
    <circle cx="1080" cy="100" r="4"/>
    <circle cx="80" cy="400" r="6"/>
    <circle cx="1100" cy="350" r="5"/>
    <circle cx="200" cy="550" r="4"/>
    <circle cx="1000" cy="520" r="5"/>
  </g>

  <!-- Connection lines to center -->
  <g stroke="#627EEA" stroke-width="0.5" opacity="0.15">
    <line x1="120" y1="120" x2="350" y2="280"/>
    <line x1="1080" y1="100" x2="850" y2="280"/>
    <line x1="80" y1="400" x2="350" y2="340"/>
    <line x1="1100" y1="350" x2="850" y2="340"/>
  </g>

  <!-- Central EVM diamond/crystal - positioned left of center -->
  <g transform="translate(300, 315)">
    <!-- Outer glow -->
    <polygon points="0,-120 84,-36 84,60 0,144 -84,60 -84,-36"
             fill="none" stroke="url(#accentGradient)" stroke-width="2"
             filter="url(#glow)" opacity="0.5"/>

    <!-- Main diamond -->
    <polygon points="0,-95 67,-28 67,48 0,115 -67,48 -67,-28"
             fill="none" stroke="url(#accentGradient)" stroke-width="3"/>

    <!-- Inner structure -->
    <polygon points="0,-60 42,-18 42,30 0,72 -42,30 -42,-18"
             fill="none" stroke="#627EEA" stroke-width="1.5" opacity="0.7"/>

    <!-- Center lines -->
    <line x1="0" y1="-60" x2="0" y2="72" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>
    <line x1="-42" y1="6" x2="42" y2="6" stroke="#8B5CF6" stroke-width="1" opacity="0.5"/>

    <!-- Center point -->
    <circle cx="0" cy="6" r="6" fill="url(#accentGradient)" opacity="0.8"/>
  </g>

  <!-- Main title - right side -->
  <text x="750" y="200" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MASTERING THE</text>
  <text x="750" y="290" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="url(#accentGradient)" text-anchor="middle" letter-spacing="3">ETHEREUM</text>
  <text x="750" y="375" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">VIRTUAL MACHINE</text>

  <!-- Subtitle -->
  <text x="750" y="430" font-family="system-ui, sans-serif" font-size="22" fill="#8B9DC3" text-anchor="middle" letter-spacing="6">2025 EDITION</text>

  <!-- Accent line -->
  <rect x="600" y="450" width="300" height="3" fill="url(#accentGradient)" opacity="0.6"/>

  <!-- CTA Button -->
  <g transform="translate(750, 510)">
    <rect x="-110" y="-28" width="220" height="56" fill="none" stroke="url(#accentGradient)" stroke-width="3"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">READ FREE</text>
  </g>

  <!-- URL -->
  <text x="750" y="590" font-family="system-ui, sans-serif" font-size="22" fill="#627EEA" text-anchor="middle" font-weight="600">masteringevm.com</text>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGradient)"/>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="url(#accentGradient)" opacity="0.5"/>
</svg>
