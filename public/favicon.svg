<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#060606"/>

  <!-- Prism shape - 3D geometric form inspired by blockchain/EVM -->
  <!-- Front face -->
  <polygon points="16,4 26,12 26,22 16,28 6,22 6,12" fill="none" stroke="#C36312" stroke-width="2"/>

  <!-- Inner edges creating 3D prism effect -->
  <line x1="16" y1="4" x2="16" y2="16" stroke="#C36312" stroke-width="1.5"/>
  <line x1="16" y1="16" x2="6" y2="12" stroke="#C36312" stroke-width="1.5"/>
  <line x1="16" y1="16" x2="26" y2="12" stroke="#C36312" stroke-width="1.5"/>
  <line x1="16" y1="16" x2="16" y2="28" stroke="#C36312" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="16" x2="6" y2="22" stroke="#C36312" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="16" x2="26" y2="22" stroke="#C36312" stroke-width="1.5" opacity="0.6"/>

  <!-- Center glow dot -->
  <circle cx="16" cy="16" r="2" fill="#C36312"/>
</svg>
